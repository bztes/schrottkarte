services:
  schrottkarte:
    build: .
    image: schrottkarte
    ports:
      - '${PORT:-3000}:3000'
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generate one with `openssl rand -base64 32`}
      ORIGIN: ${ORIGIN:?set the public origin for authentication, e.g. https://schrottkarte.example.com}
      BODY_SIZE_LIMIT: 10M
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
